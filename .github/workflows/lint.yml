name: lint

on:
  # push:
  #   branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4.2.4
        with:
          version: 2026.8.3
        env:
          MISE_AUTO_ENV: "true"
          MISE_ENV: ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      # Verify only -- do NOT auto-fix-and-commit. Pushing a bot commit onto a
      # Dependabot PR blocks its rebase, and a "[skip ci]" commit would become a
      # HEAD without the required pre-commit check, deadlocking auto-merge. Local
      # hooks (`mise run setup`) format before commit; if CI still fails, run
      # `mise run lint`
      # and push the fixes.
      - name: Run lint
        run: mise run lint
        env:
          MISE_AUTO_ENV: "true"
          MISE_ENV: ci
