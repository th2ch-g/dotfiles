approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"                                                                                                       # or danger-full-access
model_reasoning_effort = "max"
personality = "pragmatic"
plan_mode_reasoning_effort = "max"
service_tier = "default"
commit_attribution = "Co-authored-by: Codex <noreply@openai.com>"
developer_instructions = "When creating Git commits, always append `Co-authored-by: Codex <noreply@openai.com>` after one blank line."
model_verbosity = "low"
# model_context_window = 1000000
# model_auto_compact_token_limit = 900000

[analytics]
enabled = false

[feedback]
enabled = false

[features]
multi_agent = true
prevent_idle_sleep = true
codex_git_commit = true
voice_transcription = true
memories = true
# default_mode_request_user_input = true

[features.code_mode]
enabled = true

[features.context_management]
experimental_mode = true

[notice]
hide_rate_limit_model_nudge = true

[tui]
resume_cwd = "session"
status_line = [
    "model-with-reasoning",
    "context-remaining",
    "current-dir",
    "git-branch",
    "weekly-limit",
]
status_line_use_colors = true
notifications = true
notification_condition = "unfocused"

[sandbox_workspace_write]
web_search = "live"
network_access = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true
